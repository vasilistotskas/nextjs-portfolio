name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 11+ is installed by pnpm/setup, not pnpm/action-setup. It reads the
      # pnpm version from packageManager and Node.js from .nvmrc, then installs.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      # `next build` never validates WGSL, on Turbopack or webpack. This does:
      # it resolves the same import graph the loader does and fails on parse and
      # purity errors. Add --require-validation on a runner with a GPU adapter
      # to also compile the shader against a real device.
      - run: pnpm check:wgsl
      - run: pnpm type-check
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The CLI reads the token from here; a --token flag would put it in the
      # process arguments. --non-interactive below is Vercel's mode for CI.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ENABLE_EXPERIMENTAL_COREPACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # The Vercel CLI depends on esbuild, whose postinstall pnpm refuses to run
      # unless it is approved. `pnpm dlx` installs into a throwaway store, so the
      # project's `allowBuilds` does not reach it; since pnpm 12 the ignored build
      # is an error (ERR_PNPM_IGNORED_BUILDS) rather than a warning.
      - run: pnpm dlx --allow-build esbuild vercel pull --non-interactive --yes --environment=production
      - run: pnpm dlx --allow-build esbuild vercel build --non-interactive --prod
      - run: pnpm dlx --allow-build esbuild vercel deploy --non-interactive --prebuilt --prod
