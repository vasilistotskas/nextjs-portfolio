name: GitHub Actions Vercel Preview Deployment

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ENABLE_EXPERIMENTAL_COREPACK: '1'
    # Same setup as the production deploy job in ci.yml; see the notes there.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm dlx --allow-build esbuild vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx --allow-build esbuild vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx --allow-build esbuild vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
