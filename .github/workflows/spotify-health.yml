name: Spotify health

# A backstop for the in-app alert.
#
# The site mails when a token refresh fails, but that only fires while someone
# is actually visiting, and only while Resend is working. This asks the live
# endpoint the same question on a schedule, and a failed job is a mail from
# GitHub — so the two paths share no dependency beyond the site itself.
#
# It reads only the public endpoint, so no secret is needed.

on:
  schedule:
    # 08:00 UTC on the 1st and 15th — twice a month is plenty for something
    # that lapses on a six-month cycle.
    - cron: '0 8 1,15 * *'
  workflow_dispatch:

jobs:
  check:
    name: Check the Spotify grant
    runs-on: ubuntu-latest
    steps:
      - name: Query now-playing
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 30 --retry 2 --retry-delay 5 \
            https://www.vasilistotskas.com/api/spotify/now-playing)
          echo "Response: $response"

          if echo "$response" | grep -q '"unavailable":true'; then
            echo "::error::Spotify is unavailable on the live site — the grant has most" \
              "likely lapsed. Re-authorise at /api/spotify/reauth?key=… and press Agree."
            exit 1
          fi

          echo "Spotify is answering normally."
