allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # Dawn native binary. Only needed for headless Node rendering and
  # `vgpu check --require-validation`; the browser bundle never loads it.
  '@vgpu/adapter-node': false
  sharp: true
  unrs-resolver: true
  webgpu: false
# braces <=3.0.3 has no patched release. It only reaches dev tooling (ESLint and
# semantic-release, through micromatch), which expands this repo's own globs and
# never untrusted input; nothing in the deployed site depends on it.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
# These plugins cap their eslint peer at 9 and have shipped nothing since.
# eslint-config-next >=16.4.0 patches back the rule-context members ESLint 10
# removed (dist/rule-context.js), so they run correctly on 10. Pinned to the
# exact plugin versions: a new release no longer matches and must prove itself.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react@7.37.5>eslint: '10'
    eslint-plugin-jsx-a11y@6.10.2>eslint: '10'
    eslint-plugin-import@2.32.0>eslint: '10'
