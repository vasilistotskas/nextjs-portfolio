allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # Dawn native binary. Only needed for headless Node rendering and
  # `vgpu check --require-validation`; the browser bundle never loads it.
  '@vgpu/adapter-node': false
  sharp: true
  unrs-resolver: true
  webgpu: false
minimumReleaseAgeExclude:
  - framer-motion@12.40.0
  - motion-dom@12.40.0
  - motion@12.40.0
  - '@hookform/resolvers@5.4.3'
  - react-hook-form@7.83.0
  - '@types/react-dom@19.2.5 || 19.3.0'
  - '@eloqnt/config@0.1.0'
  - '@eloqnt/format-json@0.1.0'
  - '@eloqnt/format-po@0.1.0'
  - '@eslint/eslintrc@3.3.7'
  - '@types/node@26.4.1'
  - icu-minify@4.14.2
  - lucide-react@1.39.0 || 1.44.0
  - next-intl-swc-plugin-extractor@4.14.2
  - next-intl@4.14.2
  - use-intl@4.14.2
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - resend@6.27.0
  - scheduler@0.28.0
  - zod@4.6.1
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
